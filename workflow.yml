name: Autonomous Agent Team Runner

on:
  schedule:
    # Trigger automatically every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  run-agents:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r cloud-agent-team/requirements.txt

    - name: Run Agent Team Orchestrator
      env:
        AGENT_API_KEYS: ${{ secrets.AGENT_API_KEYS }}
        # Fallbacks if individual keys are preferred:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python cloud-agent-team/agent_team.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add workspace/
        # Check if there are changes to commit
        if ! git diff --cached --quiet; then
          git commit -m "🤖 Autonomous Agent Team Update [skip ci]"
          git push
        else
          echo "No changes made by agents. Skipping commit."
        fi
